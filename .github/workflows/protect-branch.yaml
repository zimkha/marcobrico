name: Enforce Branch Protection

on:
  pull_request:
    branches:
      - master

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la source de la PR
        run: |
          if [[ "${{ github.base_ref }}" == "master" && "${{ github.head_ref }}" != "develop" ]]; then
            echo "❌ Vous ne pouvez merger sur master qu'à partir de develop !"
            exit 1
          fi