server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: 'marcobrico'
    static_configs:
      - targets:
          - localhost
        labels:
          app: 'marcobrico'
          env: 'dev'
          __path__: /logs/marcobrico.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            correlationId: correlationId
            userId: userId
            uri: uri
            status: status
      - labels:
          level:
          correlationId:
          userId:
          uri:
          status:
