global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /home/k.ndiaye/Documents/khass/marcobrico/alert_rules.yml
scrape_configs:
