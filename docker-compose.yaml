version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: marcobrico-db
    environment:
      POSTGRES_USER: marcobrico
      POSTGRES_PASSWORD: marcobrico123
      POSTGRES_DB: marcobrico
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - marcobrico-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: marcobrico-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@marcobrico.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - marcobrico-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  api:
    build: .
    container_name: marcobrico-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/marcobrico
      SPRING_DATASOURCE_USERNAME: marcobrico
      SPRING_DATASOURCE_PASSWORD: marcobrico123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      JWT_SECRET: secret-key-to-change
    depends_on:
      - db
    networks:
      - marcobrico-network

volumes:
  db-data:
  pgadmin-data:

networks:
  marcobrico-network:
